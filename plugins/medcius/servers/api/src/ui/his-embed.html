<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medcius HIS 内嵌 · 静默试点</title>
  <style>
    body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 16px; font-size: 13px; }
    .panel { border: 1px solid #30363d; border-radius: 8px; background: #161b22; padding: 16px; }
    h1 { font-size: 15px; margin: 0 0 8px; color: #fff; }
    .muted { color: #8b949e; line-height: 1.5; }
    .tag { display: inline-block; background: #d2992222; color: #e3b341; border-radius: 4px; padding: 2px 8px; font-weight: 600; font-size: 11px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="tag">SILENT PILOT · 不对临床医生弹窗</div>
    <h1>HIS 患者页内嵌入口</h1>
    <p class="muted" id="status">等待院内 HIS 打开患者。静默试点将在已授权的就诊下核对今日采集状态。</p>
  </div>
  <script>
    const allowed = new Set([location.origin,...__WARD_ORIGINS__]);
    let generation = 0;
    function ack(origin,detail) {
      if (window.parent !== window && allowed.has(origin)) window.parent.postMessage({ type:"medcius:silent-ack",detail },origin);
    }
    window.addEventListener("message", async (event) => {
      if (window.parent === window || event.source !== window.parent || !allowed.has(event.origin)) return;
      const data = event.data || {};
      if (data.type === "his:context-cleared") { ++generation; document.getElementById("status").textContent="患者上下文已关闭。"; return; }
      if (data.type !== "his:patient-context") return;
      const ticket = ++generation;
      document.getElementById("status").textContent="正在核对本轮预计算状态…";
      try {
        const payload = data.payload || data;
        const sso = payload.sso_token || payload.ssoToken || data.sso_token;
        const headers = { "Content-Type": "application/json" };
        if (sso) {
          headers.Authorization = "Bearer " + sso;
          headers["X-Hospital-Token"] = sso;
        }
        const response = await fetch("/api/v1/his/embed/ward-status", {
          method: "POST",
          headers,
          cache:"no-store", redirect:"error", credentials:"omit",
          body: JSON.stringify({patient_id:payload.patient_id ?? payload.patientId,encounter_id:payload.encounter_id ?? payload.encounterId,tenant_id:payload.tenant_id ?? payload.tenantId}),
        });
        const json = await response.json();
        if (ticket !== generation) return;
        document.getElementById("status").textContent = response.ok ? (json.captured ? "本班次已完成静默预计算。" : "本班次尚无匹配的预计算记录。") : "静默状态暂不可用。";
        ack(event.origin,{ ok: response.ok, silent:true, cards:[] });
      } catch {
        if (ticket !== generation) return;
        document.getElementById("status").textContent = "静默状态暂不可用。";
        ack(event.origin,{ ok:false, silent:true, cards:[] });
      }
    });
    for(const origin of allowed) ack(origin,{ready:true,silent:true});
  </script>
</body>
</html>
