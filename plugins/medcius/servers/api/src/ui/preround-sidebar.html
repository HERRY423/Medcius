<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medcius 病区查房清单</title>
<style>
:root{font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif;color:#153839;background:#f3f7f6}*{box-sizing:border-box}
body{max-width:1040px;margin:auto;padding:clamp(12px,3vw,30px)}header,nav,main{background:white;border:1px solid #ccdcd9;border-radius:8px;padding:16px}
h1,h2,h3,p{margin:0 0 8px}h1{font-size:22px}h2{font-size:19px}h3{margin-top:18px;font-size:15px}
#layout{display:grid;grid-template-columns:minmax(160px,28%) 1fr;gap:10px;margin-top:10px}nav{align-self:start;display:grid;gap:5px}
button,summary{font:inherit;cursor:pointer;color:#115652}button{border:1px solid #abc9c4;border-radius:5px;background:#fff;padding:6px 10px;text-align:left}
button[aria-current=true]{background:#dff0eb;border-color:#37776c}button:focus-visible,summary:focus-visible{outline:3px solid #267b88}
small,.muted{color:#4b6664}.item{border-top:1px solid #e1ebe8;padding:9px 0}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
details{margin-top:3px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f6f4;padding:10px}mark{background:#ffe5a1}
@media(max-width:620px){#layout{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;max-height:32vh;overflow:auto}nav button{flex:1 0 95px}header,main,nav{padding:12px}}
</style></head><body>
<header><small id="mode"></small><h1>病区查房清单</h1><p id="status" role="status" aria-live="polite">正在读取病区清单…</p></header>
<div id="layout"><nav id="beds" aria-label="按床位选择"></nav><main id="row" tabindex="-1"></main></div>
<script>
"use strict";
const demo = "__WARD_MODE__" === "synthetic", origins = __WARD_ORIGINS__;
const $ = id => document.getElementById(id);
const node = (tag, value = "") => { const el = document.createElement(tag); el.textContent = value; return el; };
const add = (parent, tag, value) => parent.appendChild(node(tag,value));
const mode = demo ? "合成病区 · 工程演示" : "静默试点 · 授权研究复核";
$("mode").textContent = mode;
let epoch = 0, selection = 0, active = null, launch = null, batch = null, bedLabels = new Map();
const base = demo ? "/api/v1/demo/ward-preround" : "/api/v1/research/ward-preround";
const bedTitle = r => r.bed_number ? r.bed_number + "床" : "床位未提供（名册第" + r.position + "项）";
const action = (parent,label,fn) => { const b = add(parent,"button",label); b.type = "button"; b.onclick = fn; return b; };
function clear() { ++selection; active = null; $("row").replaceChildren(); }
function reset() { ++epoch; clear(); batch = null; launch = null; bedLabels = new Map(); $("beds").replaceChildren(); }
async function api(path, body) {
  const headers = {};
  if (launch?.token) headers.Authorization = "Bearer " + launch.token;
  if (body) headers["Content-Type"] = "application/json";
  const r = await fetch(path, { method: body ? "POST" : "GET", headers, body: body ? JSON.stringify(body) : undefined,
    cache:"no-store", credentials:"omit", redirect:"error", referrerPolicy:"no-referrer" });
  if (!r.ok) throw new Error(r.status === 404 ? "本次清单没有匹配记录。" : "无法读取已授权清单。");
  return r.json();
}
function localTime(value) {
  if (!value) return "未提供";
  const date = new Date(value);
  if (!Number.isFinite(date.getTime()) || !batch?.time_zone) return value;
  return new Intl.DateTimeFormat("zh-CN", {timeZone:batch.time_zone,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(date);
}
const analytes = {k:"钾",na:"钠",cl:"氯",ca:"钙",mg:"镁"};
function source(parent,s) {
  const d = add(parent,"details"); add(d,"summary","查看原始证据 · " + (s.source_id ?? "未知来源"));
  if (s.status === "verified_span") {
    const p=add(d,"pre"); p.append(document.createTextNode(s.text.slice(0,s.start)),node("mark",s.text.slice(s.start,s.end)),document.createTextNode(s.text.slice(s.end)));
  } else if (s.status === "linked_record") add(d,"pre",JSON.stringify(s.fields,null,2));
  else add(d,"p","原始版本或定位未核实。");
}
const statusText = { open:"待闭环", unknown:"待核实", requires_reconciliation:"待核对撤销或更正", closed:"已闭环" };
function display(row) {
  clear(); active=row;
  for(const b of $("beds").children) b.setAttribute("aria-current",String(Number(b.dataset.position) === row.position));
  const pane=$("row"); add(pane,"h2",bedTitle(row));
  if(row.status!=="captured") { add(pane,"p","此床本轮缺少可展示的快照。"); return; }
  if(row.source_coverage!=="connector_reported") add(pane,"small","来源覆盖待核实，空项不能证明没有变化。");
  const factById=new Map(row.facts.map(f=>[f.item_id,f]));
  const sections = { changes:[], pending:[], followup:[] };
  const sameChart = launch?.patient_id === row.context.patient_id && launch?.encounter_id === row.context.encounter_id && launch?.tenant_id === row.context.tenant_id;
  function facts(key,title,ids) {
    add(pane,"h3",title); const lines=sections[key];
    for(const id of new Set(ids)) {
      const f=factById.get(id); if(!f) continue;
      const d=add(pane,"div"); d.className="item";
      const record=f.sources.length===1 && f.sources[0].status==="linked_record" ? f.sources[0].fields : null;
      const value=f.attributes.current_value ?? record?.value ?? record?.result_value;
      const task=key==="pending" ? " · "+(f.attributes.source_status??"状态待核实")+" · 责任人 "+(f.attributes.owner_id??"待认领或核实")+" · 截止 "+localTime(f.attributes.due_at) : "";
      const line=(f.verbatim ?? [f.label,value == null ? "" : String(value),value == null ? "" : f.attributes.unit ?? record?.unit, f.attributes.status_desc ?? ""].filter(Boolean).join(" ")) + task;
      add(d,"span",line); for(const s of f.sources) source(d,s);
      if(f.sources.length && f.sources.every(s=>s.status!=="source_review_required")) lines.push(line + " ［" + f.sources.map(s=>s.source_id).join("、") + "］");
    }
    if(!ids.length) add(pane,"small","当前快照未列出。");
  }
  facts("changes","发生了什么变化",row.worklist.change_ids);
  facts("pending","今天仍待处理什么",Object.values(row.worklist.pending).flat());
  add(pane,"h3","未闭环事项");
  if(!row.worklist.unclosed_followup.length) add(pane,"small","当前来源未列出未闭环事项。");
  for(const t of row.worklist.unclosed_followup) {
    const d=add(pane,"div"); d.className="item";
    const line=(t.label ?? t.tracking_id) + " · " + (statusText[t.closure_status] ?? "待核实") + " · 责任人 " + (t.owner_id ?? "待认领或核实") + " · 截止 " + localTime(t.due_at)+(t.overdue===true?"（已逾期）":"");
    add(d,"span",line); for(const s of t.sources) source(d,s);
    if(sameChart && launch.taskReview && t.sources.some(s=>s.status!=="source_review_required")) {
      action(d,"在院内任务中核对",()=>{if(active!==row)return;
        window.parent.postMessage({type:"medcius:open-source-task",tenant_id:row.context.tenant_id,patient_id:row.context.patient_id,
          encounter_id:row.context.encounter_id,as_of:row.context.as_of,audit_event_id:batch.audit_event_id??null,
          tracking_id:t.tracking_id},launch.origin);
      });
    }
    if(t.sources.length && t.sources.every(s=>s.status!=="source_review_required")) sections.followup.push(line+" ［"+t.sources.map(s=>s.source_id).join("、")+"］");
  }
  if(row.electrolyte_trends?.length) add(pane,"h3","电解质复查");
  for(const t of row.electrolyte_trends ?? []) {
    const d=add(pane,"div");d.className="item";add(d,"span",(analytes[t.metric]??t.metric)+" · "+(t.status==="calculated" ? t.before.value+" → "+t.after.value+" "+t.unit+"，差值 "+Number(t.delta.toFixed(4))+"，间隔 "+Number(t.elapsed_hours.toFixed(2))+" 小时" : "配对测量待核实"));for(const s of t.sources) source(d,s);
  }
  if(row.administration_days?.length) add(pane,"h3","实际给药日");
  for(const a of row.administration_days ?? []) {
    const d=add(pane,"div");d.className="item";add(d,"span",a.drug_name+" · "+(a.days==null?"给药日未知":"已记录 "+a.days+" 个给药日"));for(const s of a.sources) source(d,s);
  }
  add(pane,"h3","哪些资料不足");add(pane,"small","本次有 "+row.withheld_count+" 条事实因来源或版本待核实而暂缓展示。");
  const buttons=add(pane,"div");buttons.className="actions";
  const contextMatches = row.context_match === true || launch?.patient_id === row.context.patient_id && launch?.encounter_id === row.context.encounter_id
    && launch?.tenant_id === row.context.tenant_id;
  const fieldData=Object.entries(sections).filter(([,lines])=>lines.length).map(([key,lines])=>({key,text:lines.join("\n")}));
  const names={changes:"病情变化",pending:"待办事项",followup:"未闭环事项"};
  if(demo && (!launch?.patient_id || sameChart) && fieldData.length) {
    action(buttons,"复制核实段落",async()=>{if(active!==row)return;try { await navigator.clipboard.writeText(fieldData.map(f=>(launch?.fields?.[f.key]?.label??names[f.key])+"\n"+f.text).join("\n\n"));if(active===row)$("status").textContent="已复制所选床位的合成核实段落。";}catch{if(active===row)$("status").textContent="浏览器未允许复制。";}});
    if(contextMatches && launch.fields && fieldData.some(f=>launch.fields[f.key])) action(buttons,"交给宿主预览草稿",()=>{
      if(active!==row)return;const fields=fieldData.filter(f=>launch.fields[f.key]).map(f=>({field_id:launch.fields[f.key].id,text:f.text}));
      window.parent.postMessage({type:"medcius:synthetic-draft-preview",patient_id:row.context.patient_id,encounter_id:row.context.encounter_id,
        tenant_id:row.context.tenant_id,as_of:row.context.as_of,fields,requires_physician_signature:true},launch.origin);
      $("status").textContent="已请求宿主预览合成草稿，尚未签名。";});
  }
  if(contextMatches && launch.followup) action(buttons,"向宿主追问",()=>{if(active===row)window.parent.postMessage({type:"medcius:ward-followup",position:row.position,
    audit_event_id:batch.audit_event_id??null,as_of:row.context.as_of},launch.origin);});
}
async function pick(position, matchPatient=false) {
  clear(); const ticket=selection; let data;
  try {
    if(matchPatient) data=await api(base+"/patient",{audit_event_id:batch.audit_event_id,patient_id:launch.patient_id,encounter_id:launch.encounter_id,tenant_id:launch.tenant_id});
    else data=await api(base+"?"+(demo?"":"audit_event_id="+batch.audit_event_id+"&")+"position="+position);
    if(ticket!==selection)return;
    if(!data.entries[0] || (matchPatient && !data.entries[0].context_match && data.entries[0].context && ["tenant_id","patient_id","encounter_id"].some(k=>launch[k]!==data.entries[0].context[k]))) throw new Error("当前患者与预计算快照不一致。");
    const row=data.entries[0];display({...row,bed_number:bedLabels.get(row.position)??row.bed_number});
  } catch(err) { if(ticket===selection)add($("row"),"p",err.message); }
}
// The host owns bed identifiers. Match its current census against the label
// committed at capture before using a label for a frozen chart. Never send the
// roster back to the service or put it in browser storage.
async function verifiedBeds(view,launchContext) {
  const labels=new Map();
  if(demo || !launchContext?.roster?.length || !globalThis.crypto?.subtle)return labels;
  const encoder=new TextEncoder();
  const hash=async parts=>Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",encoder.encode(JSON.stringify(parts)))),
    octet=>octet.toString(16).padStart(2,"0")).join("");
  const byBinding=new Map(view.entries.filter(r=>r.bed_binding_sha256).map(r=>[r.bed_binding_sha256,r.position]));
  for(const r of launchContext.roster) {
    if(!r || ![launchContext.tenant_id,r.patient_id,r.encounter_id].every(k=>typeof k==="string" && k.length && k.length<=256)) continue;
    const raw=r.bed_number;
    const bed=typeof raw==="string" ? raw.normalize("NFKC").trim().replace(/床$/,"").trim() : Number.isSafeInteger(raw) ? String(raw) : "";
    if(!/^[A-Z]?\d{1,3}(?:-[A-Z0-9]{1,3}|[A-Z])?$/.test(bed)) continue;
    const position=byBinding.get(await hash(["medcius.ward-bed.v1",launchContext.tenant_id,r.patient_id,r.encounter_id,view.as_of,bed]));
    if(position!==undefined)labels.set(position,bed);
  }
  return labels;
}
async function loadWard() {
  const ticket=epoch;
  try {
    const view=await api(base+(demo?"":"/today")); if(epoch!==ticket)return;
    const labels=await verifiedBeds(view,launch);if(epoch!==ticket)return;bedLabels=labels;batch=view;
    $("status").textContent="资料截至 "+localTime(view.as_of)+(view.time_zone?"（"+view.time_zone+"）":"")+" · "+view.entries.length+" 个床位记录"+(view.status==="captured"?"":" · 本轮未全部完成")+(view.audit_recorded_before_deadline===false?" · 审计索引未在 07:00 前写入":"");
    const rows=view.entries.map(r=>({...r,bed_number:bedLabels.get(r.position)??r.bed_number})).sort((a,b)=>a.bed_number && b.bed_number ? a.bed_number.localeCompare(b.bed_number,"zh",{numeric:true}) : Number(!a.bed_number)-Number(!b.bed_number) || a.position-b.position);
    for(const r of rows) {
      const b=action($("beds"),bedTitle(r)+(r.status==="captured"?" · 未闭环 "+(r.worklist_counts?.followup_open_or_unknown??"未知"):" · 未捕获"),()=>pick(r.position));
      b.dataset.position=r.position;
    }
    if(launch?.patient_id) await pick(null,true); else if(rows.length) await pick(rows[0].position);
    else add($("row"),"p","本轮病区名册为空。");
  } catch(err){if(epoch===ticket)$("status").textContent=err.message;}
}
function templateMap(input) {
  if(!input || typeof input!=="object")return null;
  const map={}, used=new Set();
  for(const k of ["changes","pending","followup"]) {
    const f=input[k];if(f===undefined)continue;
    if(!f || typeof f.id!=="string" || !/^[A-Za-z][A-Za-z0-9_.-]{0,63}$/.test(f.id) || used.has(f.id) || typeof f.label!=="string" || !f.label.trim() || f.label.length>48)return null;
    map[k]={id:f.id,label:f.label}; used.add(f.id);
  } return map;
}
window.addEventListener("message",ev=>{
  if(window.parent===window || ev.source!==window.parent || !(ev.origin===location.origin || origins.includes(ev.origin)))return;
  const m=ev.data; if(!m || !["his:patient-context","his:ward-context","his:context-cleared"].includes(m.type))return;
  reset();$("status").textContent="正在切换上下文…";
  if(m.type==="his:context-cleared"){ $("status").textContent="患者上下文已关闭。"; return; }
  const p=m.payload??{};if(m.type==="his:patient-context" && !["tenant_id","patient_id","encounter_id"].every(k=>typeof p[k]==="string" && p[k].length)){ $("status").textContent="患者或就诊上下文不完整。";return; }
  launch={origin:ev.origin,token:p.sso_token,roster:Array.isArray(p.ward_roster) && p.ward_roster.length<=1000 ? p.ward_roster : p.bed_number!=null ? [p] : [],tenant_id:p.tenant_id,patient_id:p.patient_id,encounter_id:p.encounter_id,fields:templateMap(p.template_fields),followup:p.supports_local_followup===true,taskReview:p.supports_source_task_review===true};
  if(demo || launch.token) loadWard();else $("status").textContent="等待已授权的院内复核身份。";
});
for(const origin of new Set([location.origin,...origins])) if(window.parent!==window) window.parent.postMessage({type:"medcius:ward-ready",mode:demo?"synthetic":"research"},origin);
if(demo)loadWard();else $("status").textContent="等待院内复核工作站下发授权上下文。";
</script></body></html>
