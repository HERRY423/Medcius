name: Release

on:
  push:
    tags: ['v*', 'V*']

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require successful CI for the exact release commit
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: commit} = await github.rest.repos.getCommit({owner, repo, ref: context.ref});
            for (const workflow_id of ['plugin-validate.yml', 'secret-scan.yml']) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, head_sha: commit.sha, event: 'push', per_page: 10
              });
              const latest = data.workflow_runs.sort((a,b) => b.run_number-a.run_number)[0];
              if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
                throw new Error(`RELEASE_CI_NOT_PASSED: ${workflow_id} at ${commit.sha}`);
              }
              core.info(`${workflow_id}: ${latest.html_url}`);
            }

      - name: Build and verify committed plugin archive
        run: python scripts/package-release.py --tag "$GITHUB_REF_NAME"

      - name: Publish versioned release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "output/release/medcius-${GITHUB_REF_NAME}.zip" \
            output/release/SHA256SUMS.txt output/release/release-manifest.json \
            --verify-tag --latest --title "Medcius ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
