name: Release

on:
  push:
    tags: ['v*', 'V*']

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require successful CI for the exact release commit
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: commit} = await github.rest.repos.getCommit({owner, repo, ref: context.ref});
            const {requireReleaseCi} = require(`${process.cwd()}/scripts/lib/release-ci.cjs`);
            for (const accepted of await requireReleaseCi(github, {owner,repo}, commit.sha)) {
              core.info(`${accepted.workflow}: ${accepted.url}`);
            }

      - name: Build and verify committed plugin archive
        run: python scripts/package-release.py --tag "$GITHUB_REF_NAME"

      - name: Publish versioned release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "output/release/medcius-${GITHUB_REF_NAME}.zip" \
            output/release/SHA256SUMS.txt output/release/release-manifest.json \
            --verify-tag --latest --title "Medcius ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
